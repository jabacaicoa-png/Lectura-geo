<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#217346"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Control de Gastos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',Courier,monospace;font-size:13px;font-weight:700;}
body{background:#EBEBEB;min-height:100vh;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input{font-family:'Courier New',monospace!important;font-size:13px!important;font-weight:700!important;text-transform:uppercase;}
input[type=number]{text-transform:none;}
::-webkit-scrollbar{height:4px;width:4px;}
::-webkit-scrollbar-thumb{background:#AAA;border-radius:3px;}
.ribbon{background:#217346;height:40px;display:flex;align-items:center;padding:0 10px;gap:6px;box-shadow:0 2px 4px rgba(0,0,0,.3);position:sticky;top:0;z-index:100;}
.ribbon-title{color:white;font-weight:700;font-size:14px;letter-spacing:1px;white-space:nowrap;}
.nav-btn{background:#1a5c38;border:1px solid #145029;color:white;font-size:13px;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-mes{background:white;color:#217346;font-weight:700;font-size:13px;padding:2px 8px;min-width:110px;text-align:center;}
.gdrive-bar{background:#F2F2F2;border-bottom:1px solid #CCC;padding:5px 10px;display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:nowrap;overflow-x:auto;}
.gbtn{color:white;border:none;padding:0;font-size:13px;font-family:'Courier New',monospace;cursor:pointer;border-radius:4px;white-space:nowrap;width:60px;height:36px;display:inline-flex;align-items:center;justify-content:center;}
.gbtn.blue{background:#4285F4;}.gbtn.green{background:#217346;}.gbtn.navy{background:#1F3864;}
.tab-bar{background:#BFBFBF;display:flex;align-items:flex-end;padding-left:10px;border-bottom:2px solid #9E9E9E;}
.tab{background:white;border:1px solid #9E9E9E;border-bottom:none;padding:3px 14px;font-size:13px;font-weight:700;color:#217346;cursor:pointer;}
.content{padding:10px;overflow-x:auto;}
.block{display:inline-block;background:white;border:2px solid #9E9E9E;margin-bottom:12px;box-shadow:2px 2px 0 #C5C5C5;min-width:100%;}
.ph{background:#1F3864;padding:5px 10px;color:white;font-weight:700;font-size:15px;letter-spacing:1px;}
.row{display:flex;border-bottom:1px solid #D0D0D0;}
.cell{display:flex;align-items:center;overflow:hidden;border-right:1px solid #D0D0D0;min-height:28px;flex-shrink:0;}
.cell.grow{flex:1;min-width:0;flex-shrink:1;}
.cell:last-child{border-right:none;}
.cv{font-size:13px;font-weight:700;padding:0 5px;min-height:30px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;cursor:cell;width:100%;}
.cv input{width:100%;border:none;outline:none;background:#FFF9C4;font-size:13px;font-weight:700;padding:0 5px;height:30px;}
.lbl{font-size:13px;font-weight:700;padding:2px 8px;min-height:30px;display:flex;align-items:center;}
.val{font-size:13px;font-weight:700;padding:0 5px;min-height:30px;display:flex;align-items:center;}
.th{font-size:13px;font-weight:700;color:#333;padding:2px 5px;white-space:nowrap;width:100%;text-align:left;}
.btn-rep{width:26px;min-height:30px;cursor:pointer;color:#1565C0;font-size:15px;font-weight:700;user-select:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.btn-del{width:26px;min-height:30px;cursor:pointer;color:#C00000;font-size:15px;font-weight:700;user-select:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.btn-add{padding:5px 10px;font-size:13px;cursor:pointer;user-select:none;width:100%;border-bottom:2px solid #D0D0D0;display:flex;align-items:center;min-height:30px;}
.tg-tog{width:24px;min-height:30px;cursor:pointer;font-size:13px;user-select:none;font-weight:700;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.vr{color:#C00000!important;font-weight:700!important;}
.toast{position:fixed;top:46px;left:10px;right:10px;color:white;padding:8px 12px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.4);font-size:11px;white-space:pre-line;border-radius:2px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:white;border:2px solid #1F3864;padding:18px;width:100%;max-width:340px;box-shadow:4px 4px 0 #9E9E9E;}
.modal-title{font-weight:700;font-size:14px;color:#1F3864;margin-bottom:10px;border-bottom:2px solid #D9E1F2;padding-bottom:5px;}
.modal-info{font-size:13px;color:#444;margin-bottom:10px;line-height:1.5;}
.modal-select{width:100%;padding:8px;font-size:14px;font-family:'Courier New',monospace;border:1px solid #9E9E9E;background:white;margin-bottom:12px;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.btn1{background:#217346;color:white;border:none;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;}
.btn2{background:#F2F2F2;color:#333;border:1px solid #9E9E9E;padding:8px 14px;font-size:14px;cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-container"></div>
<div id="toast-container"></div>
<script>
const CLIENT_ID='853385038024-h379oneaep6ikujs1v6o2qrfsb2skmp4.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
const FNAME='control-gastos-backup.json';
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const VER="v15";
const uid=()=>Math.random().toString(36).slice(2,10);
const PL=(a,m)=>`${MESES[m]} ${a}`;
const fmt=n=>new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(Number(n)||0);

const MV=()=>({sueldo:0,extras:[],fijos:[],tarjetas:[
  {id:"tSAN",nombre:"VISA SANTANDER",cierre:"",venc:"",fpago:"",gastos:[]},
  {id:"tVNA",nombre:"VISA NACIÓN",cierre:"",venc:"",fpago:"",gastos:[]},
  {id:"tMNA",nombre:"MASTER NACIÓN",cierre:"",venc:"",fpago:"",gastos:[]},
  {id:"tMAC",nombre:"VISA MACRO",cierre:"",venc:"",fpago:"",gastos:[]},
]});

const ST={};let vistaAnual=false;
let FIJOS={};
try{const f=localStorage.getItem('fijos_globales');if(f)FIJOS=JSON.parse(f);}catch(e){}
function saveFijos(){try{localStorage.setItem('fijos_globales',JSON.stringify(FIJOS));}catch(e){}}
function toggleFijo(id){FIJOS[id]=!FIJOS[id];if(!FIJOS[id])delete FIJOS[id];saveFijos();render();}
function esFijo(id){return!!FIJOS[id];}

// Verificados: gastos marcados como controlados contra resumen tarjeta
let VERIF={};
try{const v=localStorage.getItem('verificados');if(v)VERIF=JSON.parse(v);}catch(e){}
function saveVerif(){try{localStorage.setItem('verificados',JSON.stringify(VERIF));}catch(e){}}
function toggleVerif(id){VERIF[id]=!VERIF[id];if(!VERIF[id])delete VERIF[id];saveVerif();render();}
function esVerif(id){return!!VERIF[id];}

const HISTORY=[];
function pushHistory(){try{const snap=JSON.stringify(ST[`${anio}_${mesIdx}`]??MV());HISTORY.push({anio,mesIdx,data:snap});if(HISTORY.length>10)HISTORY.shift();}catch(e){}}
function undoLast(){
  if(!HISTORY.length){toast('⚠ No hay cambios para deshacer','#7F4F00');return;}
  const last=HISTORY.pop();
  try{const d=JSON.parse(last.data);sST(last.anio,last.mesIdx,d);lSave(last.anio,last.mesIdx);dDebounce();render();toast('✓ Cambio deshecho','#217346');}
  catch(e){toast('⚠ Error al deshacer','#7F4F00');}
}

let _lp={anio:2026,mes:new Date().getMonth()};
try{const lp=localStorage.getItem('lastPeriod');if(lp){const p=JSON.parse(lp);_lp=p;}}catch(e){}
let anio=_lp.anio,mesIdx=_lp.mes,driveFileId=null,driveReady=false,accessToken=null,TExp={};
const gST=(a,m)=>ST[`${a}_${m}`]??null;
const sST=(a,m,d)=>{ST[`${a}_${m}`]=d;};
const gM=()=>gST(anio,mesIdx)??MV();
function sM(fn){pushHistory();const c=gM(),n=typeof fn==="function"?fn(c):fn;sST(anio,mesIdx,n);ST[`__ts_${anio}_${mesIdx}`]=Date.now();lSave(anio,mesIdx);dDebounce();render();}

const lKey=(a,m)=>`gastos_${VER}_${a}_${m}`;
function lSave(a,m){const d=ST[`${a}_${m}`];if(d)try{localStorage.setItem(lKey(a,m),JSON.stringify(d));}catch(e){}}
function lLoad(a,m){try{const r=localStorage.getItem(lKey(a,m));if(r){const d=JSON.parse(r);sST(a,m,d);return d;}}catch(e){}return null;}

let dTimer=null,lastSync=null,driveHint='';
try{const ls=localStorage.getItem('lastSync_v15');if(ls)lastSync=new Date(ls);}catch(e){}
try{const h=localStorage.getItem('drive_hint');if(h)driveHint=h;}catch(e){}

function fmtHora(d){if(!d)return'nunca';return d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}

function updateDriveBar(){
  const gb=document.getElementById('drive-bar');if(!gb)return;gb.innerHTML='';
  if(!driveReady){
    const info=document.createElement('span');info.style.cssText='color:#555;font-size:11px;';info.textContent='💾 Datos locales';
    const cb=document.createElement('button');cb.className='gbtn blue';cb.textContent='SYNC';cb.onclick=cDrive;
    gb.append(info,cb);
  }else{
    const info=document.createElement('span');info.style.cssText='color:#375623;font-size:11px;';info.textContent='✓ Drive';
    const si=document.createElement('span');si.style.cssText='color:#666;font-size:11px;';si.textContent='Sync: '+fmtHora(lastSync);
    const gs=document.createElement('button');gs.className='gbtn green';gs.textContent='SYNC';gs.onclick=dSaveAll;
    gb.append(info,si,gs);
  }
  const ub=document.createElement('button');ub.className='gbtn';ub.style.cssText='background:#7F6000;font-size:22px;';ub.textContent='↺';ub.title='Deshacer';ub.onclick=undoLast;
  const dl=document.createElement('button');dl.className='gbtn navy';dl.textContent='⬇ CSV';dl.onclick=dlCSV;
  gb.append(ub,dl);
}

function dDebounce(){if(!driveReady)return;clearTimeout(dTimer);dTimer=setTimeout(dSaveAll,3000);}

async function dSaveAll(){
  if(!driveReady||!accessToken)return;
  const body=JSON.stringify(ST);
  try{
    if(driveFileId){await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body});}
    else{
      const meta=await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({name:FNAME,mimeType:'application/json'})}).then(r=>r.json());
      driveFileId=meta.id;
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body});
    }
    lastSync=new Date();try{localStorage.setItem('lastSync_v15',lastSync.toISOString());}catch(e){}
    updateDriveBar();toast('✓ Sincronizado — '+fmtHora(lastSync),'#217346');
  }catch(e){toast('⚠ Error al guardar en Drive','#7F4F00');}
}

async function dLoad(){
  if(!accessToken)return;
  try{
    const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${FNAME}'&spaces=drive&fields=files(id,name)`,{headers:{'Authorization':'Bearer '+accessToken}}).then(r=>r.json());
    if(r.files&&r.files.length>0){
      driveFileId=r.files[0].id;
      const dd=await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,{headers:{'Authorization':'Bearer '+accessToken}}).then(r=>r.json());
      const all=new Set([...Object.keys(dd).filter(k=>!k.startsWith('__ts_')),...Object.keys(ST).filter(k=>!k.startsWith('__ts_'))]);
      all.forEach(k=>{const tk=`__ts_${k}`;const lt=ST[tk]||0;const dt=dd[tk]||0;if(dt>lt){if(dd[k]!==undefined){ST[k]=dd[k];ST[tk]=dt;}}else if(!lt&&!dt){if(dd[k]!==undefined)ST[k]=dd[k];}});
      Object.keys(ST).forEach(k=>{if(!k.startsWith('__ts_')){const p=k.split('_');if(p.length>=2)try{localStorage.setItem(lKey(p[0],p[1]),JSON.stringify(ST[k]));}catch(e){}}});
      toast('✓ Datos cargados desde Drive','#217346');render();
    }else{await dSaveAll();}
  }catch(e){toast('⚠ Error al cargar desde Drive','#7F4F00');}
}

function initGA(){
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';
  s.onload=()=>{
    window.tC=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,login_hint:driveHint||undefined,
      callback:(r)=>{if(r.access_token){accessToken=r.access_token;driveReady=true;
        if(!driveHint){fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{'Authorization':'Bearer '+r.access_token}}).then(res=>res.json()).then(info=>{if(info.email){driveHint=info.email;try{localStorage.setItem('drive_hint',info.email);}catch(e){}}}).catch(()=>{});}
        dLoad();render();setTimeout(updateDriveBar,200);}}});
    mostrarModalSync();
  };
  document.head.appendChild(s);
}
function cDrive(){if(window.tC)window.tC.requestAccessToken();}

function mostrarModalSync(){
  const mc=document.getElementById('modal-container');
  mc.innerHTML=`<div class="modal-overlay"><div class="modal-box" style="text-align:center;">
    <div style="font-size:28px;margin-bottom:8px;">☁️</div>
    <div class="modal-title" style="text-align:center;font-size:15px;">CONTROL DE GASTOS</div>
    <div class="modal-info" style="text-align:center;margin-bottom:16px;">¿Sincronizar con Google Drive antes de comenzar?</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn1" id="btn-sync-init" style="width:100%;padding:10px;">☁ Sincronizar con Drive</button>
      <button class="btn2" id="btn-nosync-init" style="width:100%;padding:10px;">Continuar sin sincronizar</button>
    </div></div></div>`;
  document.getElementById('btn-sync-init').onclick=()=>{closeModal();cDrive();};
  document.getElementById('btn-nosync-init').onclick=()=>{closeModal();};
}

function dlCSV(){
  const mes=gM();
  const tE=mes.extras.reduce((s,e)=>s+(Number(e.importe)||0),0);
  const tT=mes.tarjetas.reduce((s,t)=>s+(t.gastos||[]).reduce((ss,g)=>ss+(Number(g.importe)||0),0),0);
  const tF=mes.fijos.reduce((s,f)=>s+(Number(f.importe)||0),0);
  const tG=tT+tF,iT=Number(mes.sueldo||0)+tE;
  const rows=[['CONTROL DE GASTOS - '+PL(anio,mesIdx)],[''],[`Sueldo`,mes.sueldo],...mes.extras.map(e=>[e.concepto,e.importe]),['Ingreso Total',iT],[''],
    ...mes.tarjetas.map(t=>[t.nombre,(t.gastos||[]).reduce((s,g)=>s+(Number(g.importe)||0),0)]),...mes.fijos.map(f=>[f.concepto,f.importe,f.venc,f.fpago]),
    [''],['TOTAL GASTOS',tG],['RESTO',iT-tG]];
  const csv=rows.map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`gastos-${MESES[mesIdx]}-${anio}.csv`;a.click();URL.revokeObjectURL(url);
}

let tTimer=null;
function toast(msg,bg='#1F3864'){
  const c=document.getElementById('toast-container');
  c.innerHTML=`<div class="toast" style="background:${bg}">${msg}<div onclick="this.parentElement.parentElement.innerHTML=''" style="margin-top:4px;cursor:pointer;color:#CCC;font-size:10px;text-align:right">cerrar ×</div></div>`;
  clearTimeout(tTimer);if(!bg.includes('7F'))tTimer=setTimeout(()=>{c.innerHTML='';},4000);
}

function openModal(tipo,label,itemId,tarjetaId,cuotaTotal){
  const ps=pSig(anio,mesIdx);const esC=cuotaTotal&&cuotaTotal>1;
  const opts=ps.map((p,i)=>`<option value="${i}">${PL(p.anio,p.mes)}</option>`).join('');
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box">
      <div class="modal-title">Replicar: ${label}</div>
      ${esC?`<div class="modal-info">Se crearán <b>${cuotaTotal-1} cuota${cuotaTotal>2?'s':''}</b> en los períodos siguientes.</div>`
           :`<div class="modal-info">Desde <b>${PL(anio,mesIdx)}</b> hasta:</div><select id="hsel" class="modal-select">${opts}</select>`}
      <div class="modal-btns"><button class="btn2" onclick="closeModal()">Cancelar</button>
      <button class="btn1" onclick="confirmRep('${tipo}','${itemId||''}','${tarjetaId||''}',${cuotaTotal||1},${esC})">Replicar →</button></div>
    </div></div>`;
}
function closeModal(){document.getElementById('modal-container').innerHTML='';}

let _cb=null,_cm='';
function confirmarEliminar(mensaje,onConfirm){
  _cb=onConfirm;_cm=mensaje;
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-overlay"><div class="modal-box">
      <div class="modal-title">⚠ Confirmar</div>
      <div class="modal-info">${mensaje}</div>
      <div class="modal-btns"><button class="btn2" id="bce">Cancelar</button><button class="btn1" id="bco">Confirmar</button></div>
    </div></div>`;
  document.getElementById('bce').onclick=()=>closeModal();
  const btn=document.getElementById('bco');
  const esTraer=_cm.startsWith('¿Traer');
  btn.textContent=esTraer?'Confirmar':'Eliminar';
  btn.style.background=esTraer?'#217346':'#C00000';
  btn.onclick=()=>{closeModal();if(_cb){_cb();_cb=null;}};
}

async function confirmRep(tipo,itemId,tarjetaId,cuotaTotal,esC){
  closeModal();
  const ps=pSig(anio,mesIdx);
  const sel=esC?ps.slice(0,cuotaTotal-1):ps.slice(0,Number(document.getElementById('hsel')?.value||0)+1);
  const{ok,conf}=await replic({tipo,periodos:sel,itemId:itemId||null,tarjetaId:tarjetaId||null});
  let msg=ok>0?`✓ Replicado en ${ok} período${ok>1?'s':''}`:''
  conf.forEach(c=>{msg+='\n⚠ '+c;});
  toast(msg||'Sin cambios',conf.length>0?'#7F4F00':'#1F3864');
}

function parseFecha(raw){
  if(!raw||!raw.trim())return{ok:true,val:''};
  let s=raw.trim(),dia,mes;
  const m1=s.match(/^(\d{1,2})[\/\-](\d{1,2})$/);const m2=s.match(/^(\d{2})(\d{2})$/);
  if(m1){dia=parseInt(m1[1]);mes=parseInt(m1[2]);}else if(m2){dia=parseInt(m2[1]);mes=parseInt(m2[2]);}else return{ok:false,val:''};
  if(dia<1||dia>31||mes<1||mes>12)return{ok:false,val:''};
  return{ok:true,val:String(dia).padStart(2,'0')+'/'+String(mes).padStart(2,'0')};
}

function mkFecha(val,onChange,celda){
  const div=document.createElement('div');div.className='cv';div.dataset.celda=celda;
  const refresh=()=>{div.innerHTML='';if(val){div.textContent=val;div.style.color='#000';}};
  refresh();
  div.addEventListener('click',()=>{
    div.innerHTML='';const inp=document.createElement('input');
    inp.type='text';inp.value=val||'';inp.placeholder='dd/mm';
    inp.style.cssText="width:100%;border:none;outline:none;background:#FFF9C4;font-size:13px;padding:0 5px;height:30px;";
    div.appendChild(inp);setTimeout(()=>{inp.focus();inp.select();},50);
    const commit=()=>{const r=parseFecha(inp.value);if(!r.ok&&inp.value.trim()){inp.style.background='#FFE0E0';inp.style.color='#C00000';setTimeout(()=>{val='';onChange('');refresh();},1200);return;}val=r.val;onChange(r.val);refresh();};
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}if(e.key==='Escape'){div.innerHTML='';refresh();}});
  });
  return div;
}

function mkCell(val,onChange,opts={}){
  const{type='text',bold=false,color='#000',placeholder='',celda=''}=opts;
  const display=type==='number'?(val&&val!==0?fmt(val):''):(val||'');
  const div=document.createElement('div');div.className='cv';div.dataset.celda=celda;
  div.style.fontWeight=bold?'700':'400';div.style.color=color;div.textContent=display||'';
  div.addEventListener('click',()=>{
    div.innerHTML='';const inp=document.createElement('input');
    inp.type=type==='number'?'number':'text';inp.value=val||'';inp.placeholder=placeholder;
    inp.style.cssText="width:100%;border:none;outline:none;background:#FFF9C4;font-size:13px;padding:0 5px;height:30px;";
    div.appendChild(inp);setTimeout(()=>{inp.focus();inp.select();},50);
    if(type!=='number')inp.addEventListener('input',()=>{const p=inp.selectionStart;inp.value=inp.value.toUpperCase();inp.setSelectionRange(p,p);});
    inp.addEventListener('blur',()=>{const nv=type==='number'?(inp.value===''?0:Number(inp.value)):inp.value.toUpperCase();onChange(nv);});
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();const nv=type==='number'?(inp.value===''?0:Number(inp.value)):inp.value.toUpperCase();onChange(nv);setTimeout(()=>{const all=[...document.querySelectorAll('[data-celda]')];const cur=all.findIndex(el=>el.dataset.celda===celda);if(cur!==-1&&cur+1<all.length)all[cur+1].click();},30);}
      if(e.key==='Escape')render();
    });
  });
  return div;

async function replic({tipo,periodos,itemId,tarjetaId}){
  const o=gM();let payload;
  if(tipo==="sueldo")payload=o.sueldo;
  else if(tipo==="extra")payload=o.extras.find(e=>e.id===itemId);
  else if(tipo==="fijo")payload=o.fijos.find(f=>f.id===itemId);
  else if(tipo==="tarjetaGasto"){const t=o.tarjetas.find(t=>t.id===tarjetaId);payload=t?.gastos.find(g=>g.id===itemId);}
  if(!payload&&payload!==0)return{ok:0,conf:["Ítem no encontrado"]};
  const conf=[];let ok=0;
  for(let i=0;i<periodos.length;i++){
    const{anio:a,mes:m}=periodos[i];if(!gST(a,m))lLoad(a,m);
    let d=gST(a,m)??MV();let mod=false;const lb=PL(a,m);
    if(tipo==="sueldo"){if(d.sueldo!==0&&d.sueldo!==payload)conf.push(`${lb}: Sueldo ya tiene $${fmt(d.sueldo)}`);else{d.sueldo=payload;mod=true;}}
    else if(tipo==="extra"){const idx=d.extras.findIndex(e=>e.id===itemId);if(idx!==-1){if(d.extras[idx].importe!==0&&d.extras[idx].importe!==payload.importe)conf.push(`${lb}: "${payload.concepto}" ya tiene $${fmt(d.extras[idx].importe)}`);else{d.extras[idx]={...d.extras[idx],...payload};mod=true;}}else{d.extras.push({...payload,id:uid()});mod=true;}}
    else if(tipo==="fijo"){const idx=d.fijos.findIndex(f=>f.id===itemId);if(idx!==-1){if(d.fijos[idx].importe!==0&&d.fijos[idx].importe!==payload.importe)conf.push(`${lb}: "${payload.concepto}" ya tiene $${fmt(d.fijos[idx].importe)}`);else{d.fijos[idx]={...d.fijos[idx],...payload};mod=true;}}else{d.fijos.push({...payload,id:uid()});mod=true;}}
    else if(tipo==="tarjetaGasto"){
      let ti=d.tarjetas.findIndex(t=>t.id===tarjetaId);
      if(ti===-1){d.tarjetas.push({id:tarjetaId,nombre:tarjetaId,cierre:"",venc:"",fpago:"",gastos:[]});ti=d.tarjetas.length-1;}
      const cn=1+(i+1);const dup=d.tarjetas[ti].gastos.find(g=>g.cuotaOrigen===itemId);
      if(dup&&dup.importe!==0)conf.push(`${lb}: "${payload.concepto}" cuota ${cn}/${payload.cuotaTotal} ya existe`);
      else{d.tarjetas[ti].gastos=d.tarjetas[ti].gastos.filter(g=>g.cuotaOrigen!==itemId);d.tarjetas[ti].gastos.push({id:uid(),concepto:payload.concepto,importe:payload.importe,cuotaTotal:payload.cuotaTotal,cuotaNum:cn,cuotaOrigen:itemId});mod=true;}
    }
    if(mod){sST(a,m,d);lSave(a,m);ok++;}
  }
  if(driveReady)dDebounce();return{ok,conf};
}

async function eliminarPropagadas(tarjetaId,origenId,desdeMes,desdeAnio){
  for(let i=1;i<=36;i++){
    let nm=desdeMes+i,na=desdeAnio;if(nm>11){na+=Math.floor(nm/12);nm=nm%12;}
    if(!gST(na,nm))lLoad(na,nm);const d=gST(na,nm);if(!d)continue;
    const ti=d.tarjetas?.findIndex(t=>t.id===tarjetaId)??-1;if(ti===-1)continue;
    const antes=d.tarjetas[ti].gastos.length;
    d.tarjetas[ti].gastos=d.tarjetas[ti].gastos.filter(g=>g.cuotaOrigen!==origenId);
    if(d.tarjetas[ti].gastos.length!==antes){sST(na,nm,d);lSave(na,nm);}
  }
  if(driveReady)dDebounce();
}

  // TARJETAS
  tbl.appendChild(secHd('▸  TARJETAS DE CRÉDITO','#FCE4D6','#833C00',tT));
  tbl.appendChild(mkRow([{w:24,bg:'#F4B183',node:E('div')},{w:160,bg:'#F4B183',node:thN('Tarjeta')},{w:90,bg:'#F4B183',node:thN('Total mes')},{w:58,bg:'#F4B183',node:thN('Cierre','center')},{w:58,bg:'#F4B183',node:thN('Venc.','center')},{w:58,bg:'#F4B183',node:thN('F.Pago','center')},{w:26,bg:'#F4B183',node:E('div')}],'2px solid #9E9E9E'));

  mes.tarjetas.forEach((t,ti)=>{
    const totT=(t.gastos||[]).reduce((s,g)=>s+(Number(g.importe)||0),0);
    const exp=TExp[t.id]!==false;
    const tog=E('div','tg-tog');tog.textContent=exp?'▾':'▸';tog.onclick=()=>{TExp[t.id]=!exp;render();};
    const vT=mkFecha(t.venc,v=>uT(ti,'venc',v),`t${ti}v`);if(t.venc&&!t.fpago)vT.classList.add('vr');
    tbl.appendChild(mkRow([
      {w:24,bg:'#FFF0E8',node:tog},
      {w:160,bg:'#FFF0E8',node:mkCell(t.nombre,v=>uT(ti,'nombre',v),{bold:true,color:'#833C00',celda:`t${ti}n`})},
      {w:90,bg:'#FFF0E8',node:valD(fmt(totT),{bold:true,color:'#833C00'})},
      {w:58,bg:'#FFF0E8',node:mkFecha(t.cierre,v=>uT(ti,'cierre',v),`t${ti}c`)},
      {w:58,bg:'#FFF0E8',node:vT},
      {w:58,bg:'#FFF0E8',node:mkFecha(t.fpago,v=>uT(ti,'fpago',v),`t${ti}p`)},
      {w:26,bg:'#FFF0E8',node:delB(()=>confirmarEliminar(`¿Eliminar tarjeta "${t.nombre||'esta tarjeta'}"?`,()=>uT(ti,'_d')))},
    ],'1px solid #C0C0C0'));

    if(exp){
      tbl.appendChild(mkRow([{w:24,bg:'#FDE8D8',node:E('div')},{w:24,bg:'#FDE8D8',node:E('div')},{w:160,bg:'#FDE8D8',node:thN('Concepto')},{w:90,bg:'#FDE8D8',node:thN('Importe x cuota')},{w:58,bg:'#FDE8D8',node:thN('Cuotas','center')},{w:48,bg:'#FDE8D8',node:thN('Nro.','center')},{w:26,bg:'#FDE8D8',node:E('div')},{w:26,bg:'#FDE8D8',node:E('div')}],'1px solid #E0C0A0'));
      if(!(t.gastos&&t.gastos.length)){tbl.appendChild(mkRow([{w:24,node:E('div')},{w:24,node:E('div')},{grow:true,node:(()=>{const d=E('div','cv');d.style.cssText='font-style:italic;color:#CCC;cursor:default;';d.textContent='Sin gastos cargados';return d;})()}]));}

      (t.gastos||[]).forEach((g,gi)=>{
        const prop=g.cuotaNum>1&&Number(g.cuotaTotal)>1,esC=Number(g.cuotaTotal)>1;
        const verificado=esVerif(g.id);
        const rbg=verificado?'#FFFDE7':(gi%2===0?'#FFFAF7':'#FFF3EC');
        const chkG=(!prop&&g.cuotaTotal<=1)?(()=>{const d=E('div');d.style.cssText='width:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex-shrink:0;user-select:none;';d.textContent=esFijo('tg_'+g.id)?'☑':'☐';d.onclick=()=>toggleFijo('tg_'+g.id);return d;})():E('div');
        const btnVerif=(()=>{
          const d=E('div');
          d.style.cssText=`width:26px;min-height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;background:${verificado?'#FFD700':'transparent'};color:${verificado?'#5C4000':'#CCC'};user-select:none;border-right:1px solid #D0D0D0;`;
          d.textContent='✓';
          d.title=verificado?'Verificado — tocar para desmarcar':'Marcar como verificado';
          d.onclick=(e)=>{e.stopPropagation();toggleVerif(g.id);};
          return d;
        })();
        const filaG=mkRow([
          {w:26,bg:verificado?'#FFD700':'transparent',node:btnVerif},
          {w:24,bg:rbg,node:E('div')},
          {w:24,bg:rbg,node:chkG},
          {w:160,bg:rbg,node:prop?(()=>{const d=E('div','cv');d.style.cssText='font-style:italic;color:#A07050;cursor:default;';d.textContent=g.concepto;return d;})():mkCell(g.concepto,v=>uG(ti,gi,'concepto',v),{celda:`tg${ti}-${gi}c`})},
          {w:90,bg:rbg,node:prop?(()=>{const d=E('div','cv');d.style.color='#A07050';d.textContent=fmt(g.importe);return d;})():mkCell(g.importe,v=>uG(ti,gi,'importe',Number(v)||0),{type:'number',celda:`tg${ti}-${gi}i`})},
          {w:58,bg:rbg,node:prop?(()=>{const d=E('div','cv');d.style.color='#A07050';d.textContent=g.cuotaTotal;return d;})():mkCell(g.cuotaTotal||1,v=>uG(ti,gi,'cuotaTotal',Math.max(1,Number(v)||1)),{type:'number',celda:`tg${ti}-${gi}ct`})},
          {w:48,bg:rbg,node:(()=>{const d=E('div','cv');d.style.cssText=`justify-content:center;color:${esC?'#833C00':'#AAA'};font-weight:${esC?700:400};cursor:default;`;d.textContent=esC?`${g.cuotaNum}/${g.cuotaTotal}`:'–';return d;})()},
          {w:26,bg:rbg,node:(!prop&&g.cuotaTotal<=1)?repB(()=>openModal('tarjetaGasto',`${g.concepto||'(SIN NOMBRE)'}`,g.id,t.id,1)):E('div')},
          {w:26,bg:rbg,node:delB(()=>confirmarEliminar(`¿Eliminar "${g.concepto||'este gasto'}"?`+((!prop&&g.cuotaTotal>1)?' Se eliminarán las cuotas siguientes.':''),async()=>{
            sM(m=>{const a=[...m.tarjetas];a[ti]={...a[ti],gastos:(a[ti].gastos||[]).filter((_,j)=>j!==gi)};return{...m,tarjetas:a};});
            if(!prop&&g.cuotaTotal>1&&g.id){await eliminarPropagadas(t.id,g.id,mesIdx,anio);toast('✓ Cuotas eliminadas','#217346');}
          }))},
        ],'1px solid #EEE');
        tbl.appendChild(filaG);
      });

      const rowG=E('div');rowG.style.cssText='display:flex;border-bottom:1px solid #DDD;';
      const paddG=E('div');paddG.style.cssText='width:48px;flex-shrink:0;';
      const btnAG=E('div','btn-add');btnAG.style.cssText='color:#A0522D;background:#FFF5EE;flex:1;';btnAG.textContent='+ Agregar gasto';btnAG.onclick=()=>addG(ti);
      const btnTG=E('div','btn-add');btnTG.style.cssText='color:#375623;background:#E2EFDA;border-left:1px solid #C6E0B4;flex:1;justify-content:center;';btnTG.textContent='☑ Traer fijos';btnTG.onclick=()=>traerFijosTarjeta(t.id);
      rowG.append(paddG,btnAG,btnTG);tbl.appendChild(rowG);
    }
  });
  tbl.appendChild(addB('+ Agregar tarjeta','#833C00','#FFF5EE',()=>sM(m=>({...m,tarjetas:[...m.tarjetas,{id:uid(),nombre:'',cierre:'',venc:'',fpago:'',gastos:[]}]}))));
}

lLoad(anio,mesIdx);
initGA();
render();
</script>
</body>
</html>
